name: Validate Push
on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate-all-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install citeproc
        run: npm ci

      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Unit tests
        run: |
          npm test
          python3 test/test_refresh.py

      - name: Ensure all XML/CSL files are well formed
        run: |
          xmllint --noout \
            $(find . \( -path ./node_modules -o -path ./.git \) -prune -o \
              -type f \( -name '*.xml' -o -name '*.csl' \) -print)

      - name: Build Expath Package
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: 8
      - run: ant
