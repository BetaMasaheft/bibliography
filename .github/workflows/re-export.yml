name: Scheduled Zotero Re-export

# `workflow_dispatch` ONLY for now, deliberately - no `schedule:`, no
# `push:`. See bibliography#14 for tracking. EthioStudies.xml is a Zotero
# group-358366 export that hasn't been refreshed since 2021-09-30 -
# expand.xqm (BetaMasaheft/BetMasWeb, modules/expand.xqm) falls back to a
# local collection("/db/apps/EthioStudies") lookup first and only hits the
# live Zotero API when that's absent, so a stale/missing local cache means
# every bm: bibliography pointer costs a live api.zotero.org round trip.
#
# bin/refresh-ethiostudies.py paginates the public Zotero API with
# format=tei - the same format expand.xqm's own live fallback already
# calls per-tag - and merges the pages into one <listBibl>. Tested directly
# against the live API (2026-07-24): a full run correctly produced ~12k
# biblStruct entries, well past the ~6.7k from the 2021 snapshot. Kept
# workflow_dispatch-only until a run through actual CI (not just a local
# shell) has been observed end to end, and the resulting diff reviewed by
# someone with project context.
#
# EthioStudies.rdf is NOT part of this job - see #16, nothing reads it.
#
# Once validated in CI, add schedule/push triggers and wire a notify step
# (matching expanded's notify-betmas.yml) so a refreshed cache flows into
# betmas-data the same way expanded's snapshot does.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  re-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Refresh EthioStudies.xml from the live Zotero API
        run: python3 bin/refresh-ethiostudies.py

      - name: Diff refreshed snapshot against working tree
        id: diff
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No diff - nothing to commit."
          fi

      - name: Commit and push re-export diff
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "betmas-bot"
          git config user.email "betmas-bot@users.noreply.github.com"
          git add -A
          git commit -m "chore(bibliography): scheduled Zotero re-export snapshot"
          git push origin HEAD:master
