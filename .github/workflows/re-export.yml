name: Scheduled Zotero Re-export

# workflow_dispatch only until a CI-produced refresh diff has been
# reviewed. Do not add cron/push lightly: a bad snapshot ships into
# betmas-data via notify-betmas.yml on every master push.
# After a good manual run, add e.g. schedule: cron: "0 6 * * 1".
# Notify is already separate (.github/workflows/notify-betmas.yml).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  re-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install citeproc
        run: npm ci

      - name: Refresh EthioStudies.xml from the live Zotero API
        run: python3 bin/refresh-ethiostudies.py

      - name: Validate refreshed XML before commit
        run: |
          xmllint --noout EthioStudies.xml \
            citations.xml citations-url-doi.xml \
            citations-short.xml citations-short-main.xml

      - name: Diff refreshed snapshot against working tree
        id: diff
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No diff - nothing to commit."
          fi

      - name: Commit and push re-export diff
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "betmas-bot"
          git config user.email "betmas-bot@users.noreply.github.com"
          git add EthioStudies.xml citations.xml citations-url-doi.xml citations-short.xml citations-short-main.xml
          git commit -m "chore(bibliography): scheduled Zotero re-export snapshot"
          git push origin HEAD:${{ github.ref_name }}
