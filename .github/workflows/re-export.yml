name: Scheduled Zotero Re-export

# Manually trigger building (workflow_dispatch) only until a CI-produced refresh diff has been
# reviewed. Do not add cron/push easily, as a bad snapshot could ship into
# betmas-data. After a good manual run, one could add schedule: e.g.:
# cron: "0 6 * * 1".
#
# Commits here use GITHUB_TOKEN, which does not trigger push workflows
# (see notify-betmas.yml). After a successful push, we therefore dispatch the
# bibliography-updated event (see notify-betmas.yml) ourselves, by using DEPLOY_PAT — same payload as
# notify-betmas.yml. In case of human/PR pushes to master, there is still the need to go through notify-betmas.yml.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  re-export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install citeproc
        run: npm ci

      # render-citations.js and the validate step both shell out to xmllint
      # (same as validate_pr / validate_push). Without this, refresh dies on
      # spawnSync xmllint ENOENT after a successful Zotero fetch.
      - name: Install xmllint
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      - name: Refresh EthioStudies.xml from the live Zotero API
        run: python3 bin/refresh-ethiostudies.py

      - name: Validate refreshed XML before commit
        run: |
          xmllint --noout EthioStudies.xml \
            citations.xml citations-url-doi.xml \
            citations-short.xml citations-short-main.xml

      - name: Diff refreshed snapshot against working tree
        id: diff
        run: |
          if git status --porcelain | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No diff - nothing to commit."
          fi

      - name: Commit and push re-export diff
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "betmas-bot"
          git config user.email "betmas-bot@users.noreply.github.com"
          git add EthioStudies.xml citations.xml citations-url-doi.xml citations-short.xml citations-short-main.xml
          git commit -m "chore(bibliography): scheduled Zotero re-export snapshot"
          git push origin HEAD:${{ github.ref_name }}

      # repository_dispatch always creates a run (unlike push-from-GITHUB_TOKEN).
      - name: Notify BetMas data image
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::DEPLOY_PAT is not set on this repo."
            exit 1
          fi
          gh api repos/BetaMasaheft/BetMas/dispatches \
            -f event_type=bibliography-updated
          echo "Dispatched bibliography-updated to BetMas."
