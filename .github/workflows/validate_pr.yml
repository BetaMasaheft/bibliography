name: Validate PR
on: pull_request

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Test Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-utils

      # No RNG schema applies here (Zotero TEI cache + CSL styles) -
      # well-formedness is the only structural check that makes sense
      # until this repo grows real content validation.
      - name: Ensure all XML/CSL files are well formed
        run: |
          xmllint --noout \
            $(find . -type f \( -name '*.xml' -o -name '*.csl' \))
