name: Notify BetMas

# Tells BetMas's data-base-image build that bibliography's master branch
# moved, so it can pick up the new EthioStudies snapshot.
# BetMas/build-data.yml listens for repository_dispatch:
# types: [bibliography-updated].
on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch bibliography-updated to BetMas
        env:
          GH_TOKEN: ${{ secrets.CI_BOT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::CI_BOT_PAT is not set on this repo."
            exit 1
          fi
          gh api repos/BetaMasaheft/BetMas/dispatches \
            -f event_type=bibliography-updated
